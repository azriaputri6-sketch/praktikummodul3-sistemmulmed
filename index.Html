<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Registrasi Bootstrap</title>

    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
    <script src="bootstrap/js/bootstrap.js"></script>

    <style>
        body {
            background-color: pink;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #ddd;
        }
    </style>

</head>

<body>

    <div class="container">

        <form action="">

            <div class="col-sm-10">

                <div class="form-group">
                    <label for="nama">Nama :</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Name"
                           name="nama"
                           required>
                </div>

                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email"
                           class="form-control"
                           placeholder="Email"
                           name="email"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Password :</label>
                    <input type="password"
                           class="form-control"
                           placeholder="Password"
                           name="password"
                           required>
                </div>

                <div class="form-group">
                    <label for="jk">Jenis Kelamin:</label>

                    <select class="form-control" id="jk">
                        <option>Pria</option>
                        <option>Wanita</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit
                </button>

            </div>

        </form>

    </div>

    <footer>
        <p>Azria Putri</p>
        <p>240211060002</p>
    </footer>

</body>

</html>
